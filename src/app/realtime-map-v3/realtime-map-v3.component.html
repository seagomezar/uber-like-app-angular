<div class="map-view">
  <google-map
    height="350px"
    width="100%"
    [center]="mapCenter()"
    [zoom]="zoomLevel()"
    [options]="mapOptions"
  >
    <map-marker
      [position]="userLocation()"
      [options]="userMarkerOptions"
    ></map-marker>

    @if (driverLocation(); as dLoc) {
      <map-marker
        [position]="dLoc"
        [options]="driverMarkerOptions"
      ></map-marker>
    }

    @if (routeWaypoints().length > 0) {
      <map-polyline
        [path]="routeWaypoints()"
        [options]="polylineOptions"
      ></map-polyline>
    }
  </google-map>

  <div class="version-banner">
    <span class="badge">v3</span> Enfoque: <strong>Signals & Reactividad</strong> (Reemplazo moderno de @agm/core)
  </div>

  <div class="alert">
    <a class="button"><i class="material-icons">verified_user</i></a>
    <p><strong>Evita la propagación</strong><br />Viaja sólo lo necesario</p>
  </div>

  <div class="search">
    <input type="text" placeholder="Where to?" />
  </div>

  <ul class="destinations">
    <li>
      <a class="destination-btn" (click)="requestTo('home')">
        <i class="material-icons">home</i>
        <p><strong>Home</strong><br />La Pradera Sopetran</p>
      </a>
    </li>
    <li>
      <a class="destination-btn" (click)="requestTo('work')">
        <i class="material-icons">work</i>
        <p><strong>Work</strong><br />Globant Medellín</p>
      </a>
    </li>
  </ul>
</div>
